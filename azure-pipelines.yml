trigger: none
#pipeline kab chalega

pool: alokpool
#pipeline kaha chalega, kis agent me chalega

 
steps:

- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'
  displayName: terraform install ho raha hai



- task: TerraformTask@5
  
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'alokji'
    backendAzureRmStorageAccountName: 'alokstg'
    backendAzureRmContainerName: 'alokconct'
    backendAzureRmKey: 'xyz'
  displayName: terraform init command chal rahi hai

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'validate'
  displayName: terraform validate command run ho rahi hai
# - task: TerraformTask@5
#   inputs:
#     provider: 'azurerm'
#     command: 'plan'
#     environmentServiceNameAzureRM: 'Demo-Service-Connection'
#   displayName: terraform plan command run ho rahi hai

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'alokji'
    environmentAzureRmOverrideSubscriptionID: '23c0e86f-685e-49e7-957d-37e6b7710a17'
- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: 'alokji'
  displayName: terraform apply command run ho rahi hai
